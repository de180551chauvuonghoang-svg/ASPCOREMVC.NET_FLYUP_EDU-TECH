name: CI/CD Pipeline - EduFlyUp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # STAGE 1: CI (Continuous Integration) - Build & Unit Test
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 📦 Restore Dependencies
        run: dotnet restore EduFlyUp/EduFlyUp.slnx

      - name: 🏗️ Build Solution
        run: dotnet build EduFlyUp/EduFlyUp.slnx --configuration Release --no-restore

      - name: 🧪 Run Automated Tests
        run: dotnet test EduFlyUp/EduFlyUp.Tests/EduFlyUp.Tests.csproj --configuration Release --no-build --verbosity normal

  # ─────────────────────────────────────────────────────────────
  # STAGE 2: CD (Continuous Deployment) - Trigger Railway Deploy
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Railway
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Railway CLI
        run: npm i -g @railway/cli

      - name: 🚢 Deploy to Railway Service
        run: railway up --service ASPCOREMVC.NET_FLYUP_EDU-TECH --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: eb585c0a-7f02-41e0-89c6-14885e3d43ad

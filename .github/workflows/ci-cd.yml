name: CI/CD Pipeline - EduFlyUp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # CI/CD: Automated Build, Dependency Restore & Unit Testing
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: 🛡️ Build, Verification & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 📦 Restore Dependencies
        run: dotnet restore EduFlyUp/EduFlyUp.slnx

      - name: 🏗️ Build Solution (Release)
        run: dotnet build EduFlyUp/EduFlyUp.slnx --configuration Release --no-restore

      - name: 🧪 Run All 270 Automated Unit Tests
        run: dotnet test EduFlyUp/EduFlyUp.Tests/EduFlyUp.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: ✅ Quality Gate Passed
        run: |
          echo "======================================================="
          echo "🎉 TOÀN BỘ CODE ĐÃ VƯỢT QUA KIỂM THỬ AN TOÀN 100%!"
          echo "🚀 Mã nguồn đã sẵn sàng cho Railway Production!"
          echo "======================================================="
